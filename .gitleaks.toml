title = "POZZ"

[extend]
useDefault = true

[[allowlists]]
description = "Env templates and empty KEY= placeholders — not live secrets"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)frontend/\.env\.example$''',
]
regexes = [
  '''(?i)[A-Z0-9_]*API[_-]?KEY=\s*$''',
]

# agent-toolkit:gitleaks start
[[allowlists]]
description = "agent-toolkit lock: SHA-256 hashes of vendored skill files, not secrets"
paths = ['''^\.agent/lock\.yaml$''']
# agent-toolkit:gitleaks end
