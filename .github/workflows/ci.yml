name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source=/src --verbose --redact --config=/src/.gitleaks.toml

  # backend / frontend jobs land with greenfield Task 0 (pytest, promptfoo, lint, build).
